; php artisan serve runs the PHP built-in server via the "cli-server" SAPI,
; so opcache.enable_cli must be on for OPcache to actually kick in here.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=1

; Fewer filesystem stat() calls per include, which matters a lot on a
; bind-mounted volume (Docker Desktop on Windows) where I/O is slow.
realpath_cache_size=4096K
realpath_cache_ttl=600
