name: Keep-alive database

# The InsForge project is on the free plan, which pauses the database after
# a stretch of inactivity. Hitting /api/health (a real DB query) every few
# hours keeps it in use. If a run fails, GitHub emails the repo owner — that
# usually means the project was paused and needs a restore in InsForge.

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health (wakes backend + queries DB)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o body.txt -w "%{http_code}" -m 60 \
              https://suratsdm-api-3aee8fd4-19b1-4fa5-9a2f-66e65ed7df35.fly.dev/api/health || true)
            echo "attempt $i: HTTP $code $(cat body.txt 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Database/backend tidak merespons. Cek status proyek di dashboard InsForge (mungkin paused)."
          exit 1
